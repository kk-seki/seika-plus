します。","保存後も同じ画面で次の廃棄を続けて入力できます。","修正は廃棄一覧から対象行を開き、削除は対象と日付を再確認して実行します。","単価は廃棄一覧で期間を選び、変更した行を確認して「まとめて保存」します。","Excelは月または期間を指定して出力し、期間全体と週別シートを確認します。"],check:"保存後の未同期件数が0になり、一覧へ登録内容が反映されたことを確認します。",caution:"廃棄理由は必須です。単価の同条件反映は、品目と仕入先が完全一致する表示中の行だけが対象です。"},{title:"棚卸しを開始・確認・確定する",where:"ホーム → 棚卸しモード",steps:["対象冷蔵庫を選び、新しい棚卸しを開始します。開始時点の通常在庫・その他在庫・QRロットが固定されます。","担当者が全品目と全QRロットの実数を入力し、「提出」します。","管理者は確認待ちの棚卸しを開き、未入力、差異、QRロットを確認します。","誤りがあれば差し戻し、正しければ最終確定します。","確定後、通常在庫・その他在庫・QR在庫へ反映されたことを確認します。"],check:"「確定済み」と表示され、各在庫表の数量が棚卸し結果と一致しているか確認します。",caution:"最終確定は管理者だけです。未入力が1件でもある場合は確定しません。"},{title:"QR月次Excelを作る",where:"メニュー → 月次Excel・履歴管理 → QR在庫履歴",steps:["出力する月を選びます。","「選択月をExcel出力」を押します。","月次概要、月末QR在庫、週別の操作履歴シートを確認します。","出庫先・担当者・理由・変更前後数量・重量が必要な行を確認します。"],check:"現在月は本日時点、過去月は月末時点で作成されます。",caution:"未来月は出力できません。過去時点を復元できない品名・仕入先・量目等は「現在登録」と列名に表示します。"},{title:"廃棄・QRの月次Excelを保存して履歴を整理する",where:"メニュー → 月次Excel・履歴管理",steps:["前月以前の対象月を選び、廃棄履歴またはQR操作履歴のExcelを作成してダウンロードします。","Excelの対象月・件数・内容を確認し、デスクネッツ文書管理の「QR在庫履歴」へ保管します。","「Excelファイルをデスクネッツ文書管理の該当フォルダへ保管したことを確認しました」にチェックし、「Excel保存済みとして記録」を押します。","対象月から3か月分の保持期間が終わると削除ボタンが表示されます。対象月と件数を再確認してDB履歴を削除します。"],check:"状態が「文書管理への保管確認済み」または「DB削除済み」になり、日時と担当者が記録されていることを確認します。",caution:"保存確認と3か月経過の両方を満たす月だけ削除できます。QRは操作履歴だけを整理し、QRロット本体は削除しません。"},{title:"管理機能と不具合報告を確認する",where:"メニュー／ホーム下部「使い方・連絡」",steps:["メニューから在庫表・QR・廃棄をまとめた月次Excel・履歴管理、重複確認、通常在庫の修正履歴整理、ユーザー管理を開きます。","削除や確定を行う前に、対象月・対象ロット・件数を確認します。","「不具合・エラー報告 管理」で未確認の連絡を開きます。","内容を確認し、対応状況と管理者メモを保存します。"],check:"危険な操作後は対象画面を再読込し、意図したデータだけが変わったことを確認します。",caution:"QRロット本体の完全削除は停止しています。誤操作は「直前操作を取り消す」、数量は「実数調整」、品名などは「ロット編集」で訂正します。"}]},worker:{name:"青果社員",intro:"通常在庫、QR在庫、廃棄、棚卸しを日々入力する担当者向けの手順です。",sections:[{title:"毎日の通常在庫を入力する",where:"ホーム → 在庫入力",steps:["冷蔵庫を選びます。","各品目のケース数、必要な品目は産地・規格別の内訳を入力します。","確認画面で前回数量との差を確認します。","問題がなければ登録します。"],check:"上部が「クラウド保存済み」になり、本日入力済み件数が増えたことを確認します。",caution:"誤入力は「在庫修正」から直します。QR管理品目の入出庫はQR在庫管理を使います。"},{title:"QRを入庫する",where:"QR在庫管理 → QR入庫",steps:["入庫日と品名を選びます。
