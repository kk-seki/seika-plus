name: Provision SEIKA viewer Auth user
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Create or verify viewer Auth user
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node <<'NODE'
          const BASE='https://hsuofxvcxgmsplwdigpr.supabase.co';
          const email='viewer@seika-plus.invalid';
          const key=process.env.SUPABASE_SERVICE_ROLE_KEY;
          if(!key) throw new Error('SUPABASE_SERVICE_ROLE_KEY is not configured');
          const headers={apikey:key,Authorization:`Bearer ${key}`,'Content-Type':'application/json'};
          const call=async(path,options={})=>{const r=await fetch(BASE+path,{...options,headers});const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch{}if(!r.ok)throw new Error(`${path} failed (${r.status}): ${data?.message||data?.msg||'request error'}`);return data};
          const users=[];
          for(let page=1;;page++){const data=await call(`/auth/v1/admin/users?page=${page}&per_page=100`);const batch=data?.users||[];users.push(...batch);if(batch.length<100)break}
          const existing=users.find(u=>String(u.email||'').toLowerCase()===email);
          if(existing){
            await call(`/auth/v1/admin/users/${existing.id}`,{method:'PUT',body:JSON.stringify({password:'000000',email_confirm:true,user_metadata:{legacy_user_id:'viewer',display_name:'閲覧用',app_role:'viewer'}})});
            console.log('SUCCESS: viewer Auth user verified and password updated.');
          }else{
            await call('/auth/v1/admin/users',{method:'POST',body:JSON.stringify({email,password:'000000',email_confirm:true,user_metadata:{legacy_user_id:'viewer',display_name:'閲覧用',app_role:'viewer'}})});
            console.log('SUCCESS: viewer Auth user created.');
          }
          NODE
