name: Combine index
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  combine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Combine files
        run: |
          cat index.part1.txt index.part2.txt index.part3.txt > index.new
          test $(wc -c < index.new) -gt 900000
          grep -q "v1.127" index.new
          grep -q "</html>" index.new
          mv index.new index.html
      - name: Commit
        run: |
          git diff --quiet index.html && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild index.html"
          git push
